<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astraea MT5 — AI-Powered Forex Trading Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #0A0E17;
            min-height: 100vh;
            color: #F8FAFC;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: #F8FAFC;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00F0FF;
            text-shadow: 0 0 10px rgba(0,240,255,0.3);
        }

        .header p {
            font-size: 1.1rem;
            color: #94A3B8;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .control-panel {
            background: #0B132B;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #1E293B;
            height: fit-content;
        }

        .control-panel h2 {
            color: #F8FAFC;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #1E293B;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #CBD5E1;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1E293B;
            color: #F8FAFC;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #00F0FF;
        }

        .btn {
            background: linear-gradient(135deg, #00F0FF 0%, #7000FF 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,240,255,0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #334155;
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }

        .status {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .status.success {
            background: #064E3B;
            color: #A7F3D0;
            border: 1px solid #059669;
        }

        .status.error {
            background: #7F1D1D;
            color: #FECACA;
            border: 1px solid #DC2626;
        }

        .status.info {
            background: #1E3A8A;
            color: #BFDBFE;
            border: 1px solid #2563EB;
        }

        .chart-container {
            background: #0B132B;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid #1E293B;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .chart-container h2 {
            color: #F8FAFC;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #1E293B;
            padding-bottom: 10px;
        }

        #chart {
            width: 100%;
            height: 600px;
        }

        .data-info {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .data-info h3 {
            color: #00F0FF;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .data-info p {
            margin-bottom: 5px;
            color: #CBD5E1;
        }

        .data-info strong {
            color: #F8FAFC;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #1E293B;
            border-top: 4px solid #00F0FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ASTRAEA MT5</h1>
            <p>AI-Powered Forex Trading Intelligence</p>
        </div>

        <div class="main-content">
            <div class="control-panel">
                <h2>🎯 Control Panel</h2>

                <div class="form-group">
                    <label for="model-select">Select Model:</label>
                    <select id="model-select">
                        <option value="">Please load available models first</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="device-select">Select Device:</label>
                    <select id="device-select">
                        <option value="cpu">CPU</option>
                        <option value="cuda">CUDA (NVIDIA GPU)</option>
                        <option value="mps">MPS (Apple Silicon)</option>
                    </select>
                </div>

                <div id="model-status" class="status info" style="display: none;">
                    Model status information
                </div>

                <button id="load-model-btn" class="btn btn-secondary">
                    🔄 Load Model Engine
                </button>

                <hr style="margin: 20px 0; border: 1px solid #1E293B;">

                <div class="form-group">
                    <label for="data-file-select">Select Market Data File:</label>
                    <select id="data-file-select">
                        <option value="">Please load data file list first</option>
                    </select>
                </div>

                <button id="load-data-btn" class="btn btn-secondary">
                    📁 Load Market Rates
                </button>

                <div id="data-info" class="data-info" style="display: none;">
                    <h3>📊 Market Data Summary</h3>
                    <p><strong>Rows:</strong> <span id="data-rows">-</span></p>
                    <p><strong>Columns:</strong> <span id="data-cols">-</span></p>
                    <p><strong>Time Range:</strong> <span id="data-time-range">-</span></p>
                    <p><strong>Price Range:</strong> <span id="data-price-range">-</span></p>
                </div>

                <hr style="margin: 20px 0; border: 1px solid #1E293B;">

                <div class="form-group">
                    <label for="lookback">Lookback Context Window:</label>
                    <input type="number" id="lookback" value="400" readonly>
                </div>

                <div class="form-group">
                    <label for="pred-len">Forecast Horizon Length:</label>
                    <input type="number" id="pred-len" value="120" readonly>
                </div>

                <button id="predict-btn" class="btn btn-success" disabled>
                    🔮 Generate Astraea Forecast
                </button>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Computing AI Forecast, please wait...</p>
                </div>
            </div>

            <div class="chart-container">
                <h2>📈 Forecast Visualizer</h2>
                <div id="chart"></div>
            </div>
        </div>
    </div>

    <script>
        let currentDataFile = null;
        let availableModels = [];
        let modelLoaded = false;

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        async function initializeApp() {
            await loadAvailableModels();
            await loadDataFiles();
            setupEventListeners();
        }

        async function loadAvailableModels() {
            try {
                const response = await axios.get('/api/available-models');
                if (response.data.model_available) {
                    availableModels = response.data.models;
                    populateModelSelect();
                }
            } catch (error) {
                console.error('Failed to load models:', error);
            }
        }

        function populateModelSelect() {
            const modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '<option value="">Select Forecasting Model Engine</option>';
            Object.entries(availableModels).forEach(([key, model]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = `${model.name} (${model.params}) - ${model.description}`;
                modelSelect.appendChild(option);
            });
        }

        async function loadModel() {
            const modelKey = document.getElementById('model-select').value;
            const device = document.getElementById('device-select').value;
            if (!modelKey) return;
            try {
                showLoading(true);
                const response = await axios.post('/api/load-model', { model_key: modelKey, device: device });
                if (response.data.success) {
                    modelLoaded = true;
                    showStatus('success', response.data.message);
                    document.getElementById('predict-btn').disabled = false;
                }
            } catch (error) {
                showStatus('error', 'Model loading failed');
            } finally {
                showLoading(false);
            }
        }

        async function loadDataFiles() {
            try {
                const response = await axios.get('/api/data-files');
                const dataFileSelect = document.getElementById('data-file-select');
                dataFileSelect.innerHTML = '<option value="">Select Rates File</option>';
                response.data.forEach(file => {
                    const option = document.createElement('option');
                    option.value = file.path;
                    option.textContent = `${file.name} (${file.size})`;
                    dataFileSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load data files:', error);
            }
        }

        async function loadData() {
            const filePath = document.getElementById('data-file-select').value;
            if (!filePath) return;
            try {
                showLoading(true);
                const response = await axios.post('/api/load-data', { file_path: filePath });
                if (response.data.success) {
                    currentDataFile = filePath;
                    showDataInfo(response.data.data_info);
                    showStatus('success', 'Market rates loaded successfully');
                }
            } catch (error) {
                showStatus('error', 'Data loading failed');
            } finally {
                showLoading(false);
            }
        }

        function showDataInfo(dataInfo) {
            document.getElementById('data-info').style.display = 'block';
            document.getElementById('data-rows').textContent = dataInfo.rows;
            document.getElementById('data-cols').textContent = dataInfo.columns.length;
            document.getElementById('data-time-range').textContent = `${dataInfo.start_date} to ${dataInfo.end_date}`;
            document.getElementById('data-price-range').textContent = `${dataInfo.price_range.min.toFixed(4)} - ${dataInfo.price_range.max.toFixed(4)}`;
        }

        async function startPrediction() {
            if (!currentDataFile || !modelLoaded) return;
            try {
                showLoading(true);
                const response = await axios.post('/api/predict', {
                    file_path: currentDataFile,
                    lookback: 400,
                    pred_len: 120,
                    temperature: 1.0,
                    top_p: 0.9,
                    sample_count: 1
                });
                if (response.data.success) {
                    const chartData = JSON.parse(response.data.chart);
                    chartData.layout.paper_bgcolor = '#0B132B';
                    chartData.layout.plot_bgcolor = '#0A0E17';
                    chartData.layout.font = { color: '#F8FAFC' };
                    Plotly.newPlot('chart', chartData.data, chartData.layout);
                    showStatus('success', 'Forecast generated successfully');
                }
            } catch (error) {
                showStatus('error', 'Forecast generation failed');
            } finally {
                showLoading(false);
            }
        }

        function setupEventListeners() {
            document.getElementById('load-model-btn').addEventListener('click', loadModel);
            document.getElementById('load-data-btn').addEventListener('click', loadData);
            document.getElementById('predict-btn').addEventListener('click', startPrediction);
        }

        function showStatus(type, message) {
            const statusDiv = document.getElementById('model-status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }

        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.className = show ? 'loading show' : 'loading';
        }
    </script>
</body>
</html>
